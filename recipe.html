<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Recipe Book</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ff6f61;
      color: white;
      text-align: center;
      padding: 20px;
    }
    h1 { margin: 0; }
    .container {
      width: 80%;
      margin: 20px auto;
    }
    .recipe {
      background: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .recipe h2 {
      margin-top: 0;
      color: #ff6f61;
    }
    button {
      background: #ff6f61;
      border: none;
      padding: 10px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #e0554b;
    }
    form {
      background: #fff3ed;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍲 My Recipe Book</h1>
    <p>Add and view your favorite recipes</p>
  </header>

  <div class="container">
    <!-- Form to add recipe -->
    <form id="recipeForm">
      <h2>Add New Recipe</h2>
      <input type="text" id="title" placeholder="Recipe Name" required>
      <textarea id="ingredients" placeholder="Ingredients (comma separated)" required></textarea>
      <textarea id="steps" placeholder="Steps to prepare" required></textarea>
      <button type="submit">Add Recipe</button>
    </form>

    <!-- Display recipes -->
    <div id="recipeList"></div>
  </div>

  <script>
    const recipeForm = document.getElementById("recipeForm");
    const recipeList = document.getElementById("recipeList");

    recipeForm.addEventListener("submit", function(e) {
      e.preventDefault();

      // Get values
      const title = document.getElementById("title").value;
      const ingredients = document.getElementById("ingredients").value;
      const steps = document.getElementById("steps").value;

      // Create recipe card
      const recipe = document.createElement("div");
      recipe.className = "recipe";
      recipe.innerHTML = `
        <h2>${title}</h2>
        <p><strong>Ingredients:</strong> ${ingredients}</p>
        <p><strong>Steps:</strong> ${steps}</p>
        <button onclick="this.parentElement.remove()">Delete</button>
      `;

      // Add to list
      recipeList.appendChild(recipe);

      // Reset form
      recipeForm.reset();
    });
  </script>
</body>
</html>
